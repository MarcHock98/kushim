# Kopiere nach config.toml (oder %APPDATA%\kushim\config.toml)

[memory]
# Einziger Ort, der den Speicherort des Gedächtnisses festlegt.
# Lokal:  "local:C:/Users/march/kushim-vault"
# Später: "remote:https://nas.local:8443"  (noch nicht implementiert)
location = "local:~/kushim-vault"

[backup]
# Verschlüsselte Snapshots, z.B. aufs NAS (SMB-Pfad). Leer = aus.
target = ""
keep = 10

# Wake Words stehen zentral in wakewords.toml (Vorlage: wakewords.example.toml), nicht hier.

[llm]
# Lokales Sprachmodell (Ollama-Name). Wechseln: `kushim llm set <name>`, dann laden mit
# `install.ps1 -Llm <name>`. Es sollte Deutsch und Tool-Calling können.
model = "qwen2.5:7b"

[gpu]
# Grafikkarten (NVIDIA). Anzeigen: `kushim gpu`. Bei mehreren Karten bekommt Whisper eine Karte für sich,
# das Sprachmodell nutzt die übrigen. Mit einer Karte bleibt alles wie bisher.
whisper = "auto"   # "auto", "cpu" oder Nummer der Karte (z. B. "1")
llm = "auto"       # "auto", "all" (Ollama entscheidet über alle Karten) oder Nummern wie "0,1"

[privacy]
# Modus A: alles lokal (Standard).
# Modus C: Claude nur auf ausdrücklichen Befehl, mit Vorschau + Bestätigung.
claude_enabled = false

# Kopiere nach config.toml (oder %APPDATA%\kushima\config.toml)

[memory]
# Einziger Ort, der den Speicherort des Gedächtnisses festlegt.
# Lokal:  "local:C:/Users/march/kushima-vault"
# Später: "remote:https://nas.local:8443"  (noch nicht implementiert)
location = "local:~/kushima-vault"

[backup]
# Verschlüsselte Snapshots, z.B. aufs NAS (SMB-Pfad). Leer = aus.
target = ""
keep = 10

[voice]
# Wake Words (mehrere möglich). Vortrainiert: alexa, hey_mycroft, hey_jarvis, hey_rhasspy, timer, weather.
# Eigene .onnx-Modelle nach models/wakewords/ legen und nur den Dateinamen eintragen.
wake_words = ["hey_jarvis"]

[privacy]
# Modus A: alles lokal (Standard).
# Modus C: Claude nur auf ausdrücklichen Befehl, mit Vorschau + Bestätigung.
claude_enabled = false

[package]
name = "kushim-ui"
version = "0.1.0"
edition = "2021"
description = "kushim Oberfläche (nur lokal, spricht nur mit ws://127.0.0.1)"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

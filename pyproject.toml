[project]
name = "kushim"
version = "0.1.0"
description = "Persönlicher, lokal-first KI-Assistent"
requires-python = ">=3.11"
dependencies = [
    "sqlcipher3-wheels",
    "keyring",
]

[project.optional-dependencies]
dev = ["pytest"]
# openwakeword wird mit --no-deps installiert (tflite-runtime hat auf Windows/Py3.12 keine Wheels)
voice = ["pillow==12.3.0", "sounddevice==0.5.6", "sherpa-onnx==1.13.8", "onnxruntime", "numpy", "scipy", "scikit-learn", "tqdm", "requests", "faster-whisper==1.2.1", "piper-tts==1.8.0", "nvidia-cublas-cu12==12.9.2.10", "nvidia-cudnn-cu12==9.27.0.42"]

[project.scripts]
kushim = "kushim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
